name: Build Fracture

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build application
        run: wails build -clean -ldflags="-H windowsgui"

      - name: Download yt-dlp
        run: |
          curl -fSL -o build/windows/installer/embed/yt-dlp.exe `
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
        shell: pwsh

      - name: Download ffmpeg and ffprobe
        run: |
          curl -fSL -o ffmpeg-release.7z `
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.7z"
          7z x ffmpeg-release.7z -offmpeg-temp > $null
          # Find and copy ffmpeg.exe and ffprobe.exe
          Copy-Item (Get-ChildItem -Recurse -Filter "ffmpeg.exe" ffmpeg-temp).FullName `
            "build/windows/installer/embed/ffmpeg.exe"
          Copy-Item (Get-ChildItem -Recurse -Filter "ffprobe.exe" ffmpeg-temp).FullName `
            "build/windows/installer/embed/ffprobe.exe"
          Remove-Item -Recurse -Force ffmpeg-release.7z, ffmpeg-temp
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build NSIS installer
        working-directory: build/windows/installer
        # Use cmd.exe because PowerShell can't resolve the (x86) path consistently
        run: |
          "%ProgramFiles(x86)%\NSIS\makensis.exe" installer.nsi
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fracture-installer
          path: build/windows/installer/Fracture-Installer.exe
          retention-days: 7

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fracture-portable
          path: build/bin/Fracture.exe
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: fracture-installer
          path: artifacts

      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: fracture-portable
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fracture ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/Fracture-Installer.exe
            artifacts/Fracture.exe
